[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eternal-memory-core"
version = "1.0.0"
description = "3D Weaire-Phelan & Associative Spiderweb Vector Living Memory Core for AI Agents and LLMs"
readme = "README.md"
authors = [{ name = "Faol88" }]
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "chromadb>=0.4.22",
    "sentence-transformers>=2.2.2",
    "pyyaml>=6.0.1",
    "customtkinter>=5.2.0",
    "cryptography>=41.0.0",
    "requests>=2.31.0",
]

[project.urls]
Homepage = "https://github.com/Faol88/eternal-memory-core"
Documentation = "https://github.com/Faol88/eternal-memory-core/blob/main/docs/GUIDE.md"
